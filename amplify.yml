version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify exposes console variables to the build environment, but the
        # Next SSR compute does not inherit them, so server code sees nothing
        # at runtime. Writing them into .env.production is what carries them
        # through. Without this every AWS call fails with a missing variable
        # while the build itself succeeds, which is a confusing way to lose an
        # hour.
        - env | grep -E '^(APP_REGION|BILLS_BUCKET|LEDGER_TABLE|OPENROUTER_API_KEY|OPENROUTER_MODEL)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
